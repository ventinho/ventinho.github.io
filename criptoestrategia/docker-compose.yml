services:
  criptoestrategia:
    build: .
    image: criptoestrategia:latest
    container_name: criptoestrategia
    restart: unless-stopped
    ports:
      # Publica em todas as interfaces do PC: abre em http://192.168.1.64:8050 (e http://localhost:8050).
      # Não fixamos o IP aqui: no Docker Desktop (Windows) isso costuma impedir o contentor de arrancar.
      - "8050:8050"
    volumes:
      - ./data:/app/data          # base de dados SQLite fica fora do contentor
    environment:
      - TZ=Europe/Lisbon
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
